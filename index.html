      --shadow-glow: 0 0 20px rgba(65, 105, 255, 0.35);
      --shadow-purple: 0 8px 30px rgba(118, 87, 232, 0.2);

      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.97); }

      background: var(--gradient-blue-purple);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:hover { 
      filter: brightness(1.12); 
      box-shadow: 0 6px 22px rgba(65, 105, 255, 0.5);
      transform: translateY(-1px);
    }

    .btn-sos {

      border: 1px solid rgba(255, 255, 255, 0.3);

      75%, 100% { transform: scale(1.6); opacity: 0; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

      from { transform: rotate(0deg); }

      // 2. ROBUST AUDIO SIREN SYNTHESIZER (With Autoplay Resume & Unlock)
      // ==========================================
      const Siren = {
        ctx: null,
        osc: null,
        gain: null,
        timer: null,
        isHigh: false,
        active: false,
        unlocked: false,
        audioElement: null,

        // Pre-unlock AudioContext on user interaction anywhere on the page
        initUnlock() {
          const unlock = () => {
            if (this.unlocked) return;
            try {
              const AudioContextClass = window.AudioContext || window.webkitAudioContext;
              if (AudioContextClass) {
                if (!this.ctx || this.ctx.state === 'closed') {
                  this.ctx = new AudioContextClass();
                }
                if (this.ctx.state === 'suspended') {
                  this.ctx.resume().then(() => {
                    this.unlocked = true;
                  }).catch(() => {});
                } else {
                  this.unlocked = true;
                }
              }
            } catch (e) {
              console.warn('Audio unlock error:', e);
            }
          };

          ['click', 'touchstart', 'touchend', 'keydown', 'pointerdown'].forEach(ev => {
            window.addEventListener(ev, unlock, { once: false, passive: true });
          });
        },

        async toggle() {
          if (this.active) {
            this.stop();
          } else {
            await this.start();
          }
          state.isSirenOn = this.active;
          renderApp();
        },

        async start() {
          if (this.active) return;
          try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
              this.startFallbackBeep();
              return;
            }

            if (!this.ctx || this.ctx.state === 'closed') {
              this.ctx = new AudioContextClass();
            }

            if (this.ctx.state === 'suspended') {
              await this.ctx.resume();
            }

            this.osc = this.ctx.createOscillator();
            this.gain = this.ctx.createGain();

            // Emergency police wail: sawtooth wave swinging between 700Hz and 1150Hz
            this.osc.type = 'sawtooth';
            const now = this.ctx.currentTime;
            this.osc.frequency.setValueAtTime(700, now);
            this.gain.gain.setValueAtTime(0.35, now);

            this.osc.connect(this.gain);
            this.gain.connect(this.ctx.destination);
            this.osc.start();
            this.active = true;
            this.unlocked = true;
            state.isSirenOn = true;

            this.isHigh = false;
            if (this.timer) clearInterval(this.timer);
            this.timer = setInterval(() => {
              if (!this.osc || !this.ctx || this.ctx.state === 'closed') return;
              try {
                const t = this.ctx.currentTime;
                const target = this.isHigh ? 700 : 1150;
                this.osc.frequency.cancelScheduledValues(t);
                this.osc.frequency.linearRampToValueAtTime(target, t + 0.38);
                this.isHigh = !this.isHigh;
              } catch (e) {
                console.warn('Siren ramp error:', e);
              }
            }, 400);

          } catch (e) {
            console.warn('Web Audio start failed, switching to fallback:', e);
            this.startFallbackBeep();
          }
        },

        startFallbackBeep() {
          try {
            if (!this.audioElement) {

              const AudioContextClass = window.AudioContext || window.webkitAudioContext;
              if (AudioContextClass) {
                const actx = new AudioContextClass();
                const buf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
                const cd = buf.getChannelData(0);
                for (let i = 0; i < buf.length; i++) {
                  cd[i] = Math.sin(2 * Math.PI * 880 * (i / actx.sampleRate)) * 0.3;
                }
              }
            }
          } catch (e) {
            console.warn('Fallback audio failed:', e);
          }
          this.active = true;
          state.isSirenOn = true;
        },

        stop() {
          if (this.timer) {
            clearInterval(this.timer);
            this.timer = null;
          }
          if (this.osc) {
            try { this.osc.stop(); this.osc.disconnect(); } catch(e){}
            this.osc = null;
          }
          if (this.gain) {
            try { this.gain.disconnect(); } catch(e){}
            this.gain = null;
          }
          if (this.ctx && this.ctx.state !== 'closed') {
            try { this.ctx.close(); } catch(e){}
            this.ctx = null;
          }
          if (this.audioElement) {
            try { this.audioElement.pause(); this.audioElement.currentTime = 0; } catch(e){}
            this.audioElement = null;
          }
          this.active = false;
          state.isSirenOn = false;
        }

      // Single-Tap Instant Emergency SOS Handler
      // Activates immediately. No countdown, No hold, No progress delay.
      // Disables button to prevent duplicate submissions. Shows loading indicator.
      window.triggerInstantSos = function(customMsg) {
        if (state.sosSubmitting) return; // Prevent accidental duplicate submissions

        state.sosSubmitting = true;
        state.sosErrorMsg = null;
        state.sosConfirmationMsg = null;
        renderApp();

        function finishSosSubmission(loc) {
          try {
            const newReq = {
              id: 'SHK-SOS-' + Math.floor(1000 + Math.random() * 9000),
              userId: state.currentUser?.id || 'user_001',
              userName: state.currentUser?.name || 'Priya Sharma',
              userPhone: state.currentUser?.mobile || '9876543210',
              timestamp: new Date().toISOString(),
              status: 'Submitted',
              urgency: 'Critical',
              location: {
                address: loc.address || DEMO_LOCATIONS[0].address,
                latitude: loc.lat || DEMO_LOCATIONS[0].lat,
                longitude: loc.lng || DEMO_LOCATIONS[0].lng,
                isDemoLocation: !state.useRealGps,
              },
              emergencyMessage: customMsg || 'Emergency SOS pressed. Immediate assistance requested.',
              notes: [
                { id: 'n1', author: 'System Dispatch', text: 'Emergency distress call logged. Dispatched to Central Women Safety Control Room.', time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) }
              ],
              contactsNotified: state.contacts.filter(c => c.userId === state.currentUser?.id).map(c => ({
                name: c.name,
                phone: c.phone,
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
              }))
            };

            const list = [newReq, ...DB.getEmergencies()];
            DB.saveEmergencies(list);
            state.emergencies = list;
            state.activeEmergency = newReq;
            state.sosSubmitting = false;
            state.sosStep = 'tracking';
            state.page = 'sos';
            state.sosConfirmationMsg = '🚨 Emergency SOS broadcasted successfully! Police dispatch & guardian contacts alerted.';
            renderApp();

            // Background automatic progression simulation for demo testing
            setTimeout(() => {
              const cur = DB.getEmergencies();
              const target = cur.find(r => r.id === newReq.id);
              if (target && target.status === 'Submitted') {
                target.status = 'Under Review';
                target.notes.push({
                  id: 'n_rev_' + Date.now(),
                  author: 'Central Dispatcher',
                  text: 'Coordinates verified. Nearest women safety patrol team assigned.',
                  time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
                });
                DB.saveEmergencies(cur);
                state.emergencies = cur;
                if (state.activeEmergency?.id === newReq.id) {
                  state.activeEmergency.status = 'Under Review';
                  state.activeEmergency.notes = target.notes;
                }
                renderApp();
              }
            }, 3000);

          } catch (err) {
            state.sosSubmitting = false;
            state.sosErrorMsg = 'Failed to submit Emergency SOS. Please try again or call 112 directly.';
            renderApp();
          }
        }

        if (state.useRealGps && 'geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              finishSosSubmission({
                address: `Live GPS: ${pos.coords.latitude.toFixed(4)}° N, ${pos.coords.longitude.toFixed(4)}° E`,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
              });
            },
            () => {
              // Fallback to verified safe demo location if denied or timed out
              finishSosSubmission(DEMO_LOCATIONS[0]);
            },
            { timeout: 3500 }
          );
        } else {
          // Instant safe simulated demo location (instant, no delay)
          finishSosSubmission(DEMO_LOCATIONS[0]);
        }
      };

        if (type === 'error') {

          msgEl.style.borderColor = '#e11d48';
          msgEl.style.color = '#fecdd3';
          msgEl.innerHTML = `<strong>Error:</strong> ${msg}`;

          msgEl.style.background = 'rgba(16, 185, 129, 0.2)';
          msgEl.style.borderColor = '#10b981';
          msgEl.style.color = '#a7f3d0';
          msgEl.innerHTML = `<strong>Success:</strong> ${msg}`;

          msgEl.style.borderColor = '#6366f1';
          msgEl.style.color = '#c7d2fe';
          msgEl.innerHTML = `${msg}`;

      window.handlePhotoSelect = function(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          showProfileMsg('Please select a valid image file (JPEG, PNG, WebP).', 'error');
          return;
        }

        if (file.size > 2 * 1024 * 1024) {
          showProfileMsg('Selected image is too large. Please select an image under 2MB.', 'error');
          return;
        }

        const reader = new FileReader();

      window.saveUserProfile = async function() {
        const nameEl = document.getElementById('profile-name');
        const phoneEl = document.getElementById('profile-mobile');
        const emailEl = document.getElementById('profile-email');
        const bloodEl = document.getElementById('profile-blood');
        const pinEl = document.getElementById('profile-pin');
        const saveBtn = document.getElementById('profile-save-btn');
        const btnText = document.getElementById('profile-btn-text');

        if (!nameEl || !phoneEl) return;

        const name = nameEl.value.trim();
        const mobile = phoneEl.value.trim();
        const email = emailEl ? emailEl.value.trim() : '';
        const bloodGroup = bloodEl ? bloodEl.value : 'B+';
        const pin = pinEl ? pinEl.value.trim() : '1234';

        if (!name) {
          state.profileError = 'Please enter your full name.';
          state.profileSuccess = null;
          showProfileMsg(state.profileError, 'error');
          nameEl.focus();
          return;
        }

        const cleanMobile = mobile.replace(/[^0-9]/g, '');
        if (cleanMobile.length < 10) {
          state.profileError = 'Please enter a valid 10-digit mobile number.';
          state.profileSuccess = null;
          showProfileMsg(state.profileError, 'error');
          phoneEl.focus();
          return;
        }

        if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          state.profileError = 'Please enter a valid email address format.';
          state.profileSuccess = null;
          showProfileMsg(state.profileError, 'error');
          emailEl.focus();
          return;
        }

        if (saveBtn) saveBtn.disabled = true;
        if (btnText) {
          btnText.innerHTML = `<span class="loading-spin" style="width:14px; height:14px; border:2px solid #ffffff; border-top-color:transparent; border-radius:50%; margin-right:8px; vertical-align:middle;"></span> Saving to Firestore & Local Storage...`;
        }
        showProfileMsg('Saving profile to Cloud Firestore and local storage...', 'info');

        try {
          // Simulated Firestore network call / async sync
          await new Promise(res => setTimeout(res, 550));

          let finalPhoto = state.currentUser?.photoUrl || '';
          if (state.tempProfilePhoto !== undefined) {
            finalPhoto = state.tempProfilePhoto;
          }

          const updatedUser = {
            ...(state.currentUser || {}),
            name: name,
            mobile: mobile,
            email: email,
            bloodGroup: bloodGroup,
            emergencyPin: pin,
            photoUrl: finalPhoto,
            updatedAt: new Date().toISOString()
          };

          DB.setUser(updatedUser);
          const users = DB.getUsers();
          const idx = users.findIndex(u => u.id === updatedUser.id);
          if (idx >= 0) {
            users[idx] = updatedUser;
          } else {
            users.push(updatedUser);
          }
          DB.saveUsers(users);

          state.currentUser = updatedUser;
          state.tempProfilePhoto = undefined;
          state.profileError = null;
          state.profileSuccess = 'Profile changes saved successfully to Firebase Firestore and local store!';

          renderApp();
        } catch (err) {
          console.error('Failed to update profile:', err);
          state.profileError = 'Failed to save profile changes. Please try again.';
          state.profileSuccess = null;
          if (saveBtn) saveBtn.disabled = false;
          if (btnText) btnText.innerText = 'Save Profile Changes';
          showProfileMsg(state.profileError, 'error');
        }
      };

        return `
          <div class="container animate-fadeIn" style="max-width: 640px; padding: 2rem 1rem;">
            <div class="card" style="margin-bottom: 1.5rem; background: linear-gradient(135deg, #17233D 0%, #10182B 100%); border: 1px solid #1E2D4E; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);">
              <span style="font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #4169FF;">Account & Security</span>
              <h1 style="font-size: 1.85rem; font-weight: 900; margin-top: 0.25rem; color: #F8FAFC;">Profile & Emergency Settings</h1>
              <p style="font-size: 0.85rem; color: #AAB6D3; margin-top: 0.25rem;">Update your personal details, emergency contact info, and profile avatar.</p>
            </div>

            <!-- Profile Message Alert Banner -->
            <div id="profile-msg" style="display: ${state.profileSuccess || state.profileError ? 'block' : 'none'}; padding: 0.875rem 1rem; border-radius: 0.85rem; margin-bottom: 1.25rem; font-size: 0.825rem; border: 1px solid ${state.profileError ? '#E94B68' : '#10B981'}; background: ${state.profileError ? 'rgba(233, 75, 104, 0.15)' : 'rgba(16, 185, 129, 0.15)'}; color: ${state.profileError ? '#FDA4AF' : '#34D399'}; font-weight: 700;">
              ${state.profileError ? `<strong>Error:</strong> ${state.profileError}` : (state.profileSuccess ? `<strong>Success:</strong> ${state.profileSuccess}` : '')}
            </div>

            <div class="card" style="display: flex; flex-direction: column; gap: 1.25rem; font-size: 0.825rem; background: #17233D; border: 1px solid #1E2D4E; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);">
              
              <!-- Profile Photo Section -->
              <div style="display: flex; align-items: center; gap: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid #1E2D4E;">
                <div style="position: relative; width: 4.75rem; height: 4.75rem; border-radius: 9999px; overflow: hidden; border: 2.5px solid #4169FF; flex-shrink: 0; background: #10182B; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(65, 105, 255, 0.35);">
                  <img id="profile-photo-img" src="${photo}" alt="Avatar Preview" style="width: 100%; height: 100%; object-fit: cover; display: ${photo ? 'block' : 'none'};" />
                  <div id="profile-photo-initial" style="font-size: 1.85rem; font-weight: 900; color: #4169FF; display: ${photo ? 'none' : 'flex'}; align-items: center; justify-content: center; width: 100%; height: 100%;">
                    ${initial}
                  </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
                  <div>
                    <h3 style="font-weight: 800; font-size: 1rem; color: #F8FAFC;">Profile Verification Photo</h3>
                    <p style="font-size: 0.75rem; color: #AAB6D3;">Upload a clear photo so first responders can identify you on scene.</p>
                  </div>
                  <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <input type="file" id="profile-photo-input" accept="image/*" style="display: none;" onchange="handlePhotoSelect(event)" />
                    <button type="button" onclick="document.getElementById('profile-photo-input').click()" class="btn btn-secondary" style="padding: 0.4rem 0.85rem; font-size: 0.75rem;">
                      ${icon('camera', 'w-4 h-4')}
                      <span>Upload Photo</span>
                    </button>
                    <button type="button" id="profile-photo-remove" onclick="removeProfilePhoto()" class="btn" style="background: transparent; color: #E94B68; border: 1px solid #E94B68; padding: 0.4rem 0.85rem; font-size: 0.75rem; display: ${photo ? 'inline-flex' : 'none'};">
                      ${icon('trash', 'w-3.5 h-3.5')}
                      <span>Remove</span>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Full Name Field -->
              <div>
                <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.35rem;">Full Name *</label>
                <input type="text" id="profile-name" value="${user.name || ''}" placeholder="e.g. Priya Sharma" style="width: 100%;" />
              </div>

              <!-- Mobile Number Field -->
              <div>
                <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.35rem;">Mobile Number (Emergency Contact) *</label>
                <input type="tel" id="profile-mobile" value="${user.mobile || ''}" placeholder="10-digit mobile number" style="width: 100%;" />
                <span style="font-size: 0.7rem; color: #AAB6D3; margin-top: 0.25rem; display: block;">Used by dispatchers to call you during an active SOS.</span>
              </div>

              <!-- Email Field -->
              <div>
                <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.35rem;">Email Address</label>
                <input type="email" id="profile-email" value="${user.email || ''}" placeholder="name@example.com" style="width: 100%;" />
                <span style="font-size: 0.7rem; color: #AAB6D3; margin-top: 0.25rem; display: block;">Used for incident reports and safety audit summaries.</span>
              </div>

              <!-- Blood Group & PIN Grid -->
              <div class="grid grid-cols-1 grid-cols-sm-2 gap-4">
                <div>
                  <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.35rem;">Blood Group</label>
                  <select id="profile-blood" style="width: 100%;">
                    ${['B+', 'A+', 'O+', 'AB+', 'B-', 'A-', 'O-', 'AB-'].map(b => `
                      <option value="${b}" ${(user.bloodGroup || 'B+') === b ? 'selected' : ''}>${b}</option>
                    `).join('')}
                  </select>
                </div>
                <div>
                  <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.35rem;">Emergency Cancel PIN (4 Digits)</label>
                  <input type="password" id="profile-pin" maxlength="4" value="${user.emergencyPin || '1234'}" style="width: 100%; font-family: monospace; letter-spacing: 0.25em; text-align: center;" />
                </div>
              </div>

              <!-- Save Changes Button with Loading State -->
              <button id="profile-save-btn" onclick="saveUserProfile()" class="btn btn-primary" style="padding: 0.875rem; font-size: 0.9rem; margin-top: 0.5rem; justify-content: center;">
                <span id="profile-btn-text">Save Profile Changes</span>
              </button>
            </div>
          </div>
        `;
      }

      function renderFakeCallModal() {
        return `
          <div class="modal-backdrop">
            <div class="modal-content" style="max-width: 320px; text-align: center; border-radius: 2rem; background: #17233D; border: 1.5px solid #1E2D4E; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);">
              <button onclick="closeFakeCall()" style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #AAB6D3; cursor: pointer;">
                ${icon('x', 'w-5 h-5')}
              </button>

              ${!state.fakeCallAccepted ? `
                <div style="padding: 1.5rem 0;">
                  <div style="width: 5rem; height: 5rem; border-radius: 9999px; background: #10182B; border: 2.5px solid #7657E8; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; color: #7657E8;">
                    ${icon('phone', 'w-8 h-8')}
                  </div>
                  <h3 style="font-weight: 900; font-size: 1.4rem; color: #F8FAFC;">Papa (Home)</h3>
                  <p style="font-size: 0.8rem; color: #4169FF; font-weight: 700; margin-top: 0.25rem;">Incoming Call...</p>
                  
                  <div style="display: flex; justify-content: center; gap: 2rem; margin-top: 2.5rem;">
                    <button onclick="closeFakeCall()" style="width: 4rem; height: 4rem; border-radius: 9999px; background: #EF4444; border: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5);">
                      ${icon('phone', 'w-6 h-6 transform rotate-135')}
                    </button>
                    <button onclick="state.fakeCallAccepted = true; renderApp();" style="width: 4rem; height: 4rem; border-radius: 9999px; background: #10B981; border: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);">
                      ${icon('phone', 'w-6 h-6')}
                    </button>
                  </div>
                </div>
              ` : `
                <div style="padding: 1.5rem 0;">
                  <div style="width: 4.5rem; height: 4.5rem; border-radius: 9999px; background: rgba(16, 185, 129, 0.2); border: 2.5px solid #10B981; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; color: #34D399;">
                    ${icon('phone', 'w-7 h-7')}
                  </div>
                  <h3 style="font-weight: 900; font-size: 1.3rem; color: #F8FAFC;">Papa (Home)</h3>
                  <p style="font-size: 0.8rem; color: #34D399; font-weight: 800; font-family: monospace; margin-top: 0.25rem;">00:14 • Connected</p>
                  
                  <div style="background: #10182B; padding: 0.85rem; border-radius: 0.85rem; border: 1px solid #1E2D4E; margin: 1.5rem 0; font-size: 0.75rem; color: #AAB6D3; line-height: 1.4;">
                    <em>"Haan beta, I am standing right at the corner with Sharma ji. Where are you? Walking toward the gate now."</em>
                  </div>

                  <button onclick="closeFakeCall()" style="width: 3.5rem; height: 3.5rem; border-radius: 9999px; background: #EF4444; border: none; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0 auto; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5);">
                    ${icon('phone', 'w-5 h-5 transform rotate-135')}
                  </button>
                </div>
              `}
            </div>
          </div>
        `;
      }

      function renderComplaintSuccessModal() {
        return `
          <div class="modal-backdrop">
            <div class="modal-content" style="max-width: 400px; text-align: center; background: #17233D; border: 1.5px solid #1E2D4E; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);">
              <div style="width: 3.75rem; height: 3.75rem; border-radius: 9999px; background: rgba(16, 185, 129, 0.2); color: #34D399; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                ${icon('checkCircle', 'w-8 h-8')}
              </div>
              <h3 style="font-weight: 900; font-size: 1.35rem; color: #F8FAFC;">Complaint Registered</h3>
              <p style="font-size: 0.8rem; color: #AAB6D3; margin: 0.5rem 0 1.25rem;">
                Your grievance has been safely logged with the Women Safety Cell. A tracking token has been generated.
              </p>
              <div style="background: #10182B; padding: 0.6rem; border-radius: 0.65rem; border: 1.5px solid #1E2D4E; font-family: monospace; font-size: 0.9rem; font-weight: 900; color: #4169FF; margin-bottom: 1.25rem;">
                ${state.complaintSuccessModal.id}
              </div>
              <button onclick="state.complaintSuccessModal = null; renderApp();" class="btn btn-primary" style="width: 100%;">
                Done
              </button>
            </div>
          </div>
        `;
      }

      function renderPoliceModal() {
        return `
          <div class="modal-backdrop">
            <div class="modal-content" style="background: #17233D; border: 1.5px solid #1E2D4E; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div>
                  <span style="font-family: monospace; font-weight: 800; font-size: 0.8rem; color: #4169FF;">${state.policeSelectedReq.id}</span>
                  <h3 style="font-weight: 900; font-size: 1.2rem; margin-top: 0.25rem; color: #F8FAFC;">Incident Dispatch Controller</h3>
                </div>
                <button onclick="state.policeSelectedReq = null; renderApp();" style="background: none; border: none; color: #AAB6D3; cursor: pointer;">
                  ${icon('x', 'w-5 h-5')}
                </button>
              </div>

              <div style="background: #10182B; padding: 0.85rem; border-radius: 0.85rem; border: 1px solid #1E2D4E; font-size: 0.775rem; margin-bottom: 1rem; color: #F8FAFC; line-height: 1.5;">
                <strong style="color: #4169FF;">Victim:</strong> ${state.policeSelectedReq.userName} (${state.policeSelectedReq.userPhone})<br/>
                <strong style="color: #4169FF;">Location:</strong> ${state.policeSelectedReq.location?.address}
              </div>

              <div style="display: flex; flex-direction: column; gap: 0.75rem; font-size: 0.75rem; margin-bottom: 1.25rem;">
                <div>
                  <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.25rem;">Status</label>
                  <select id="pol-status">
                    <option value="Assigned" ${state.policeSelectedReq.status === 'Assigned' ? 'selected' : ''}>Assigned</option>
                    <option value="Assistance in Progress" ${state.policeSelectedReq.status === 'Assistance in Progress' ? 'selected' : ''}>Assistance in Progress</option>
                    <option value="Resolved" ${state.policeSelectedReq.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                  </select>
                </div>

                <div>
                  <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.25rem;">Assign Patrol Unit</label>
                  <input id="pol-vehicle" type="text" value="${state.policeSelectedReq.assignedTo?.patrolVehicle || 'PCR Van Delta-04'}" />
                </div>

                <div>
                  <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.25rem;">Officer In-Charge</label>
                  <input id="pol-officer" type="text" value="${state.policeSelectedReq.assignedTo?.officerName || 'Inspector Kavita Deshmukh'}" />
                </div>

                <div>
                  <label style="color: #F8FAFC; font-weight: 700; display: block; margin-bottom: 0.25rem;">Officer Action Notes</label>
                  <textarea id="pol-notes" rows="2" placeholder="e.g. Patrol car dispatched via 100 Feet Ring Road. ETA 4 mins.">${state.policeSelectedReq.officerRemarks || ''}</textarea>
                </div>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                <button onclick="state.policeSelectedReq = null; renderApp();" class="btn btn-secondary">
                  Cancel
                </button>
                <button onclick="handlePoliceUpdate(state.policeSelectedReq.id)" class="btn btn-primary">
                  Update & Dispatch Unit
                </button>
              </div>

            </div>
          </div>
        `;
      }

      // Expose to window for inline onclick handlers & testing
      window.state = state;
      window.renderApp = renderApp;
      window.Siren = Siren;
      window.DB = DB;

      // Initial Render
      renderApp();
    })();
  </script>
</body>
</html>
